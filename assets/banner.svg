<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbd7cf"/>
      <stop offset="100%" stop-color="#c9c4b9"/>
    </linearGradient>

    <pattern id="circuit" width="140" height="140" patternUnits="userSpaceOnUse">
      <g stroke="#3a3a3a" stroke-width="1" fill="none" opacity="0.14">
        <path d="M0 30 H50 V70 H100"/>
        <path d="M20 0 V20 H60 V60"/>
        <path d="M140 40 H90 V90 H60 V140"/>
        <path d="M0 110 H30 V140"/>
        <path d="M110 0 V30 H140"/>
        <circle cx="50" cy="30" r="3"/>
        <circle cx="60" cy="60" r="3"/>
        <circle cx="90" cy="90" r="3"/>
        <circle cx="30" cy="110" r="3"/>
        <circle cx="110" cy="30" r="3"/>
        <circle cx="20" cy="20" r="2.5"/>
        <circle cx="100" cy="70" r="2.5"/>
      </g>
    </pattern>

    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9c4b9" stop-opacity="0"/>
      <stop offset="65%" stop-color="#c9c4b9" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c9c4b9" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#circuit)"/>
  <rect width="1200" height="260" fill="url(#fade)"/>

  <text x="1150" y="115" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="3" fill="#1c1c1c">RODRIGO VEGA</text>
  <text x="1150" y="150" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="1.5" fill="#3d3d3d">Full Stack Developer</text>
</svg>
